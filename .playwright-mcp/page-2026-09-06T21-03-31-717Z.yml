            - heading "History" [level=2] [ref=f6e131]
            - paragraph [ref=f6e132]: Apple comes from Old English æppel, meaning "apple" or any fruit, from Proto-Germanic *ap(a)laz and possibly PIE *ab(e)l- "apple," though the original sense is uncertain. In Middle English and into the 17th century, it served as a generic term for all fruit except berries, later becoming associated with the forbidden fruit in Genesis and gaining extended meanings like "apple of one's eye" and "apple-polisher."

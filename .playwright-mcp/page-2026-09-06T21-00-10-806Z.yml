                - heading "Glossary" [level=2] [ref=f3e26]
                - paragraph [ref=f3e27]: A reference for the linguistic terms and concepts used throughout EtymoMap, as well as general terms that are useful for linguistics or terminology used in any of the blog posts.
            - generic [ref=f3e28]:
                - heading "Historical Linguistics" [level=3] [ref=f3e29]
                - generic [ref=f3e30]:
                    - generic [ref=f3e31]:
                        - term [ref=f3e32]: Comparative linguistics
                        - definition [ref=f3e33]: The comparison of languages to establish their relationships and reconstruct their histories.
                    - generic [ref=f3e34]:
                        - term [ref=f3e35]: Etymology
                        - definition [ref=f3e36]: The study of word origins and how their forms and meanings have developed over time.
                    - generic [ref=f3e37]:
                        - term [ref=f3e38]: Etymology tree
                        - definition [ref=f3e39]: A visual map of a word's ancestry, laid out as a directed acyclic graph of ancestor forms.
                    - generic [ref=f3e40]:
                        - term [ref=f3e41]: Grimm's Law
                        - definition [ref=f3e42]: A sound law describing the systematic consonant shifts from Proto-Indo-European to Proto-Germanic, setting the Germanic languages apart from the rest of Indo-European.
                    - generic [ref=f3e43]:
                        - term [ref=f3e44]: Historical linguistics
                        - definition [ref=f3e45]: The study of how languages change over time.
                    - generic [ref=f3e46]:
                        - term [ref=f3e47]: Lingua franca
                        - definition [ref=f3e48]: A language used as a common means of communication between speakers of different native languages.
                    - generic [ref=f3e49]:
                        - term [ref=f3e50]: Neologism
                        - definition [ref=f3e51]: A newly coined word or expression.
                    - generic [ref=f3e52]:
                        - term [ref=f3e53]: Reconstruction
                        - definition [ref=f3e54]: The process of inferring unattested earlier forms of a language by comparing its descendants and applying known sound changes. Reconstructed words are conventionally prefixed with an asterisk (*).
                    - generic [ref=f3e55]:
                        - term [ref=f3e56]: Sound law
                        - definition [ref=f3e57]: A regular, systematic change in pronunciation that applies across a language over time.
            - generic [ref=f3e58]:
                - heading "Word Formation" [level=3] [ref=f3e59]
                - generic [ref=f3e60]:
                    - generic [ref=f3e61]:
                        - term [ref=f3e62]: Abbreviation
                        - definition [ref=f3e63]: A shortened written form of a word or phrase.
                    - generic [ref=f3e64]:
                        - term [ref=f3e65]: Affix
                        - definition [ref=f3e66]: A bound morpheme attached to a word to modify its meaning or grammatical function.
                    - generic [ref=f3e67]:
                        - term [ref=f3e68]: Back-formation
                        - definition [ref=f3e69]: Forming a shorter word by removing a real or perceived affix from a longer word.
                    - generic [ref=f3e70]:
                        - term [ref=f3e71]: Clipping
                        - definition [ref=f3e72]: Shortening a word to a shorter form, such as ad from advertisement.
                    - generic [ref=f3e73]:
                        - term [ref=f3e74]: Compound
                        - definition [ref=f3e75]: A word formed by combining two or more existing words.
                    - generic [ref=f3e76]:
                        - term [ref=f3e77]: Confix (circumfix)
                        - definition [ref=f3e78]: An affix that surrounds the base on both sides.
                    - generic [ref=f3e79]:
                        - term [ref=f3e80]: Derivation
                        - definition [ref=f3e81]: Forming a new word by adding affixes or making other changes to an existing word.
                    - generic [ref=f3e82]:
                        - term [ref=f3e83]: Eponymy
                        - definition [ref=f3e84]: Naming something after a person or place.
                    - generic [ref=f3e85]:
                        - term [ref=f3e86]: Initialism
                        - definition [ref=f3e87]: An abbreviation formed from the initial letters of words and pronounced letter by letter.
                    - generic [ref=f3e88]:
                        - term [ref=f3e89]: Onomatopoeia
                        - definition [ref=f3e90]: A word that imitates the sound it names.
                    - generic [ref=f3e91]:
                        - term [ref=f3e92]: Portmanteau
                        - definition [ref=f3e93]: A word formed by merging parts of two or more words.
                    - generic [ref=f3e94]:
                        - term [ref=f3e95]: Prefix
                        - definition [ref=f3e96]: An affix placed before the base of a word.
                    - generic [ref=f3e97]:
                        - term [ref=f3e98]: Root
                        - definition [ref=f3e99]: The core morpheme that carries a word's primary meaning.
                    - generic [ref=f3e100]:
                        - term [ref=f3e101]: Suffix
                        - definition [ref=f3e102]: An affix placed after the base of a word.
            - generic [ref=f3e103]:
                - heading "Borrowing & Language Contact" [level=3] [ref=f3e104]
                - generic [ref=f3e105]:
                    - generic [ref=f3e106]:
                        - term [ref=f3e107]: Calque (loan translation)
                        - definition [ref=f3e108]: A borrowing formed by translating the individual elements of a foreign expression.
                    - generic [ref=f3e109]:
                        - term [ref=f3e110]: Language contact
                        - definition [ref=f3e111]: Interaction between languages that produces borrowing and structural convergence.
                    - generic [ref=f3e112]:
                        - term [ref=f3e113]: Learned borrowing
                        - definition [ref=f3e114]: A word re-imported from a classical language with little change to its form.
                    - generic [ref=f3e115]:
                        - term [ref=f3e116]: Loanword (borrowing)
                        - definition [ref=f3e117]: A word adopted from another language.
                    - generic [ref=f3e118]:
                        - term [ref=f3e119]: Orthographic borrowing
                        - definition [ref=f3e120]: A loanword that keeps the spelling of the source language.
                    - generic [ref=f3e121]:
                        - term [ref=f3e122]: Phono-semantic matching
                        - definition [ref=f3e123]: A borrowing chosen to match both the sound and meaning of native material.
                    - generic [ref=f3e124]:
                        - term [ref=f3e125]: Semantic loan (semantic calque)
                        - definition [ref=f3e126]: Borrowing only a meaning from another language, without the word's form.
                    - generic [ref=f3e127]:
                        - term [ref=f3e128]: Semi-learned borrowing
                        - definition [ref=f3e129]: A borrowing that has been partially adapted to the receiving language's patterns.
                    - generic [ref=f3e130]:
                        - term [ref=f3e131]: Unadapted borrowing
                        - definition [ref=f3e132]: A loanword retained in close to its original foreign form.
            - generic [ref=f3e133]:
                - heading "Genetic & Phylogenetic Classification" [level=3] [ref=f3e134]
                - generic [ref=f3e135]:
                    - generic [ref=f3e136]:
                        - term [ref=f3e137]: Afro-Asiatic
                        - definition [ref=f3e138]: A major language family of northern Africa and the Middle East, including Arabic, Hebrew, and Amharic.
                    - generic [ref=f3e139]:
                        - term [ref=f3e140]: Ancestor language
                        - definition [ref=f3e141]: An earlier language from which a later language descends.
                    - generic [ref=f3e142]:
                        - term [ref=f3e143]: Austronesian
                        - definition [ref=f3e144]: A major language family spread across Southeast Asia and the Pacific, including Malay, Tagalog, and Hawaiian.
                    - generic [ref=f3e145]:
                        - term [ref=f3e146]: Branch (subfamily)
                        - definition [ref=f3e147]: An intermediate grouping of languages within a family.
                    - generic [ref=f3e148]:
                        - term [ref=f3e149]: Celtic
                        - definition [ref=f3e150]: A branch of the Indo-European family including Irish, Welsh, Scottish Gaelic, and Breton.
                    - generic [ref=f3e151]:
                        - term [ref=f3e152]: Cognate
                        - definition [ref=f3e153]: Words in different languages that descend from a common ancestor.
                    - generic [ref=f3e154]:
                        - term [ref=f3e155]: Descendant language
                        - definition [ref=f3e156]: A later language that developed from an earlier one.
                    - generic [ref=f3e157]:
                        - term [ref=f3e158]: Doublet
                        - definition [ref=f3e159]: Two words in one language that come from the same source by different routes.
                    - generic [ref=f3e160]:
                        - term [ref=f3e161]: Dravidian
                        - definition [ref=f3e162]: A major language family of southern India, including Tamil, Telugu, Kannada, and Malayalam.
                    - generic [ref=f3e163]:
                        - term [ref=f3e164]: East Germanic
                        - definition [ref=f3e165]: An extinct subgroup of the Germanic languages, the best attested of which is Gothic.
                    - generic [ref=f3e166]:
                        - term [ref=f3e167]: Family tree (phylogeny)
                        - definition [ref=f3e168]: The hierarchical genealogy showing how the members of a language family descend from one another.
                    - generic [ref=f3e169]:
                        - term [ref=f3e170]: Germanic
                        - definition [ref=f3e171]: A branch of the Indo-European family including English, German, Dutch, and the Scandinavian languages.
                    - generic [ref=f3e172]:
                        - term [ref=f3e173]: Indo-European (family)
                        - definition [ref=f3e174]: A large language family spanning much of Europe and parts of Asia, including the Germanic, Romance, Slavic, Celtic, Greek, and Indo-Iranian branches.
                    - generic [ref=f3e175]:
                        - term [ref=f3e176]: Language family
                        - definition [ref=f3e177]: A group of languages descended from a common ancestor.
                    - generic [ref=f3e178]:
                        - term [ref=f3e179]: Lowest common ancestor
                        - definition [ref=f3e180]: The deepest shared branching point between two languages in a family tree.
                    - generic [ref=f3e181]:
                        - term [ref=f3e182]: Niger–Congo
                        - definition [ref=f3e183]: A major language family of sub-Saharan Africa, including Swahili, Yoruba, and Zulu.
                    - generic [ref=f3e184]:
                        - term [ref=f3e185]: North Germanic
                        - definition [ref=f3e186]: A subgroup of the Germanic languages including the Scandinavian languages, such as Danish, Swedish, Norwegian, and Icelandic.
                    - generic [ref=f3e187]:
                        - term [ref=f3e188]: Proto-Germanic
                        - definition [ref=f3e189]: The reconstructed common ancestor of the Germanic languages.
                    - generic [ref=f3e190]:
                        - term [ref=f3e191]: Proto-Indo-European
                        - definition [ref=f3e192]: The reconstructed common ancestor of the Indo-European language family.
                    - generic [ref=f3e193]:
                        - term [ref=f3e194]: Proto-Italic
                        - definition [ref=f3e195]: The reconstructed common ancestor of the Italic languages, including Latin.
                    - generic [ref=f3e196]:
                        - term [ref=f3e197]: Proto-language
                        - definition [ref=f3e198]: A reconstructed ancestral language from which a family descends.
                    - generic [ref=f3e199]:
                        - term [ref=f3e200]: Proto-Romance
                        - definition [ref=f3e201]: The reconstructed common ancestor of the Romance languages, essentially the spoken (Vulgar) Latin of late antiquity, as distinct from the literary Classical Latin.
                    - generic [ref=f3e202]:
                        - term [ref=f3e203]: Proto-West Germanic
                        - definition [ref=f3e204]: The reconstructed common ancestor of the West Germanic languages, including English, German, Dutch, and Frisian.
                    - generic [ref=f3e205]:
                        - term [ref=f3e206]: Romance
                        - definition [ref=f3e207]: A branch of the Indo-European family descended from Latin, including French, Spanish, Italian, Portuguese, and Romanian.
                    - generic [ref=f3e208]:
                        - term [ref=f3e209]: Sino-Tibetan
                        - definition [ref=f3e210]: A major language family of East Asia, including Chinese (Mandarin), Burmese, and Tibetan.
                    - generic [ref=f3e211]:
                        - term [ref=f3e212]: Slavic
                        - definition [ref=f3e213]: A branch of the Indo-European family including Russian, Polish, Czech, and the South Slavic languages.
                    - generic [ref=f3e214]:
                        - term [ref=f3e215]: Uralic
                        - definition [ref=f3e216]: A language family native to northern Eurasia, including Finnish, Hungarian, and Estonian.
                    - generic [ref=f3e217]:
                        - term [ref=f3e218]: West Germanic
                        - definition [ref=f3e219]: A subgroup of the Germanic languages including English, German, Dutch, and Frisian.

                    - text: over
                    - emphasis [ref=f4e219]: native
                    - text: ", and coining new"
                    - emphasis [ref=f4e220]: wordstock
                    - text: to replace foreign
                    - emphasis [ref=f4e221]: vocabulary
                    - text: .

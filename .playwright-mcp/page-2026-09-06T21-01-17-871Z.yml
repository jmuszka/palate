        - generic [ref=f5e24]:
            - heading "About the EtymoMap Project" [level=3] [ref=f5e25]
            - paragraph [ref=f5e26]: EtymoMap is a historical geolinguistic atlas for visualizing the evolution of natural language over time and space.
            - paragraph [ref=f5e27]:
                - emphasis [ref=f5e28]: Palate
                - text: is the atlas client you are currently viewing, while
                - emphasis [ref=f5e29]: Larynx
                - text: is the linguistics API server responsible for interfacing with the graph database containing semantic relations between words and their ancestors, phonetic metadata, phylogenetic family trees, and historical geospatial data from peer-reviewed academic sources.
            - paragraph [ref=f5e30]:
                - text: Through
                - emphasis [ref=f5e31]: Palate
                - text: ", one can interface with tools to view a language's geographic influence over time, explore Sprachbund diffusion areas and other means of interlingual convergence, visualize a word's etymology tree (structured as a directed acyclic graph) and trace its phylogenetic heritage, and more. By unifying these spatial, temporal, and genealogical layers into a single interface, EtymoMap provides a rich, contextual framework for comparative linguistics and historical anthropology. Future plans include richer cross-language analysis, demonstrating sound-law changes, and features leveraging computational linguistics."
            - paragraph [ref=f5e32]: "Language is not a mere means of communication: it encapsulates entire cultures, dictates worldviews, and influences modes of thought, with measurable effects spanning everyday human interaction, international diplomacy, artistic expression, and philosophical inquiry. EtymoMap's purpose is to open a window onto the cross section of one of the most intricate abstract structures in our universe and democratize access to the most profound apparatus and driving force of the human experience lying right on our tongues."
            - paragraph [ref=f5e33]: I created this digital atlas to express my intersecting interests in language, history, formal structures, and digital cartography. One of the reasons I love making educational tools is not purely for the pedagogical purpose of imparting knowledge onto others, but also as a medium to share my passions and to gain a more rigorous understanding of the topics I find intrinsically fascinating.
            - paragraph [ref=f5e34]: Building EtymoMap served as an excellent vessel to deepen my understanding of theoretical linguistics and its subfields while pushing me to solve complex engineering challenges in spatial graph indexing and real-time visualization. I would encourage anyone fascinated by a subject as multifaceted as linguistics to build a multi-domain tool such as this one - it is a powerful way to indulge your inner obsessions while making knowledge more accessible to those around you.

                - heading "Explore the story behind every word" [level=3] [ref=f1e31]
                - paragraph [ref=f1e32]: From the viking invasions to the Norman-French conquest in 1066, and from post-Renaissance neologisms to its status as a global lingua franca, the English language boasts a fascinating history and development. Despite its origins as a West Germanic language, over two-thirds of the English lexicon consists of Romance vocabulary, mainly from French and Latin, with significant influence from Old Norse, Greek, and many others as well.
                - paragraph [ref=f1e33]: Open any entry to uncover a word's etymology, the languages and older forms it descended from, laid out alongside its International Phonetic Alphabet spelling, historical usage, and an interactive atlas that maps where it came from and how it spread across the world.
